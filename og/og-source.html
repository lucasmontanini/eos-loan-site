<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/styles.css">
<style>
  html,body{margin:0;padding:0}
  .og{width:1200px;height:630px;background:var(--eos-bone);display:flex;align-items:stretch;overflow:hidden;box-sizing:border-box}
  .left{flex:0 0 570px;display:flex;flex-direction:column;justify-content:center;padding:56px 8px 56px 64px;box-sizing:border-box}
  .lockup{display:flex;align-items:center;gap:12px}
  .wordmark{font-family:var(--font-brand);font-weight:700;letter-spacing:-.045em;font-size:44px;color:var(--eos-charcoal)}
  .wordmark .loan{font-weight:400}
  .headline{margin-top:36px;font-family:var(--font-display);font-weight:600;font-size:54px;line-height:1.08;letter-spacing:-.015em;color:var(--eos-charcoal);max-width:11ch}
  .headline mark{background:var(--eos-ember-tint);color:var(--eos-charcoal);padding:0 .1em}
  .sub{margin-top:26px;font-family:var(--font-ui);font-weight:600;font-size:21px;line-height:1.5;color:rgba(23,18,14,.62);max-width:26ch}
  .foot{margin-top:40px;display:flex;align-items:center;gap:16px;font-family:var(--font-mono);font-size:14px;color:rgba(23,18,14,.40);letter-spacing:.06em}
  .right{flex:1;padding:36px 36px 36px 28px;box-sizing:border-box;display:flex}
  .photo{flex:1;border-radius:18px;border:1px solid rgba(23,18,14,.10);background:url('../uploads/family_beatiful.jpg') center 30%/cover no-repeat}
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <div class="lockup">
      <svg width="40" height="40" viewBox="0 0 100 100"><defs><clipPath id="cutA"><polygon points="0,0 100,0 100,31 0,73"/></clipPath><clipPath id="cutB"><polygon points="0,79 100,37 100,100 0,100"/></clipPath></defs><g clip-path="url(#cutA)"><circle cx="46" cy="50" r="42" fill="#17120E"/></g><g clip-path="url(#cutB)"><circle cx="54" cy="50" r="42" fill="#17120E"/></g></svg>
      <div class="wordmark">Eos <span class="loan">Loan</span></div>
    </div>
    <div class="headline">Built to finance everything <mark>essential</mark>.</div>
    <div class="sub">Real estate, utilities and mobility &amp; fleet — credit from the lender itself.</div>
    <div class="foot"><span>SSN / ITIN accepted</span><span>·</span><span>NMLS #2744537</span></div>
  </div>
  <div class="right"><div class="photo"></div></div>
</div>
</body>
</html>
