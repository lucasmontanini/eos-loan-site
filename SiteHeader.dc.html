<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/tokens/colors.css">
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/tokens/typography.css">
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/tokens/base.css">
  <link rel="stylesheet" href="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/styles.css">
  <script src="_ds/eos-loan-design-system-c354e9d2-4994-4830-8502-d902c9605e16/_ds_bundle.js"></script>
  <style>
    @keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}
    @media (max-width:920px){
      [data-r="desknav"]{display:none !important}
      [data-r="deskctl"]{display:none !important}
      [data-r="burger"]{display:flex !important}
    }
  </style>
</helmet>
<div style="background:var(--eos-white);border-bottom:1px solid var(--line);position:relative" onMouseLeave="{{ closeMenus }}">
  <div style="max-width:1240px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:16px;flex-wrap:nowrap">
    <a href="/" onMouseEnter="{{ closeMenus }}" style="text-decoration:none;display:flex;align-items:center;gap:7px;flex:none" aria-label="Eos Loan home">
      <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.SolRasgado" size="{{ szIcon }}" micro="{{ no }}" color="charcoal" hint-size="17px,17px"></x-import>
      <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.EosLogo" variant="lockup" size="{{ logoSize }}" hint-size="118px,26px"></x-import>
    </a>
    <nav data-r="desknav" style="flex:1;min-width:0;display:flex;justify-content:center;gap:2px;flex-wrap:nowrap;white-space:nowrap">
      <a href="RealEstate.dc.html" style="{{ sRe }}" style-hover="color:var(--eos-ember)">Real estate</a>
      <a href="Utilities.dc.html" style="{{ sUt }}" style-hover="color:var(--eos-ember)">Utilities</a>
      <a href="Mobility.dc.html" style="{{ sMf }}" style-hover="color:var(--eos-ember)">Mobility &amp; fleet</a>
      <a href="Partners.dc.html" style="{{ sPartners }}" style-hover="color:var(--eos-ember)">Partners</a>
      <a href="Contact.dc.html" style="{{ sContact }}" style-hover="color:var(--eos-ember)">Contact</a>
    </nav>
    <div data-r="deskctl" style="flex:none;display:flex;align-items:center;gap:10px;margin-left:auto" onMouseEnter="{{ closeMenus }}">
      <div style="display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em" aria-label="Language">
        <span style="color:var(--text-1);font-weight:700">EN</span>
        <span style="color:var(--text-3)">·</span>
        <span style="color:var(--text-3);cursor:default" title="Español — coming soon">ES</span>
        <span style="color:var(--text-3)">·</span>
        <span style="color:var(--text-3);cursor:default" title="Português — coming soon">PT</span>
      </div>
      <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.Button" variant="ghost" size="sm" href="#" hint-size="72px,36px">Sign in</x-import>
      <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.Button" variant="primary" size="sm" href="GetStarted.dc.html" hint-size="140px,36px">Check your rate</x-import>
    </div>
    <button type="button" data-r="burger" onClick="{{ openMobile }}" aria-label="Open menu" style="display:none;margin-left:auto;width:42px;height:42px;border:1px solid var(--line-strong);border-radius:999px;background:none;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px">
      <span style="width:16px;height:2px;background:var(--eos-charcoal);border-radius:2px"></span>
      <span style="width:16px;height:2px;background:var(--eos-charcoal);border-radius:2px"></span>
    </button>
  </div>

  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:600;background:var(--eos-bone);display:flex;flex-direction:column;padding:0 24px 24px;overflow:auto;animation:overlayIn .25s ease both">
      <div style="height:64px;display:flex;align-items:center;justify-content:space-between;flex:none">
        <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:7px" aria-label="Eos Loan home">
          <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.SolRasgado" size="{{ szIcon }}" micro="{{ no }}" color="charcoal" hint-size="17px,17px"></x-import>
          <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.EosLogo" variant="lockup" size="{{ logoSize }}" hint-size="118px,26px"></x-import>
        </a>
        <button type="button" onClick="{{ closeMobile }}" aria-label="Close menu" style="width:42px;height:42px;border:1px solid var(--line-strong);border-radius:999px;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--text-1);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui)">&#215;</button>
      </div>
      <nav style="margin-top:24px;display:flex;flex-direction:column">
        <a href="RealEstate.dc.html" onClick="{{ closeMobile }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none">
          <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--eos-ember)">01</span>
          <span style="font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--text-1)">Real estate</span>
        </a>
        <a href="Utilities.dc.html" onClick="{{ closeMobile }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none">
          <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--eos-ember)">02</span>
          <span style="font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--text-1)">Utilities</span>
        </a>
        <a href="Mobility.dc.html" onClick="{{ closeMobile }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none">
          <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--eos-ember)">03</span>
          <span style="font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--text-1)">Mobility &amp; fleet</span>
        </a>
        <a href="Partners.dc.html" onClick="{{ closeMobile }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none">
          <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--eos-ember)">04</span>
          <span style="font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--text-1)">Partners</span>
        </a>
        <a href="Contact.dc.html" onClick="{{ closeMobile }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none">
          <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--eos-ember)">05</span>
          <span style="font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--text-1)">Contact</span>
        </a>
      </nav>
      <div style="margin-top:22px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em">
        <span style="color:var(--text-1);font-weight:700">EN</span>
        <span style="color:var(--text-3)"> &#183; ES &#183; PT</span>
        <span style="color:var(--text-3);font-size:10.5px"> (soon)</span>
      </div>
      <div style="margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:10px">
        <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.Button" size="lg" href="GetStarted.dc.html" hint-size="100%,48px">Check your rate</x-import>
        <x-import component-from-global-scope="EosLoanDesignSystem_c354e9.Button" size="lg" variant="ghost" href="#" hint-size="100%,48px">Sign in</x-import>
      </div>
      <div style="margin-top:18px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)">Eos Loan &#183; NMLS #2744537</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;realestate&quot;,&quot;utilities&quot;,&quot;mobility&quot;,&quot;partners&quot;,&quot;contact&quot;,&quot;getstarted&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;}}">
class Component extends DCLogic {
  state = { menu: null, mobile: false };
  renderVals() {
    const a = this.props.active ?? "home";
    const base = { fontFamily: "var(--font-ui)", fontWeight: 700, fontSize: "13.5px", textDecoration: "none", color: "var(--text-1)", padding: "7px 9px", display: "inline-flex", alignItems: "center", gap: "5px", borderRadius: "999px", whiteSpace: "nowrap" };
    const on = { ...base, color: "var(--eos-ember)" };
    return {
      no: false,
      logoSize: 22,
      szIcon: 17,
      sRe: a === "realestate" ? on : base,
      sUt: a === "utilities" || a === "battery" ? on : base,
      sMf: a === "mobility" ? on : base,
      sPartners: a === "partners" ? on : base,
      sContact: a === "contact" ? on : base,
      closeMenus: () => {},
      mobileOpen: this.state.mobile,
      openMobile: () => this.setState({ mobile: true }),
      closeMobile: () => this.setState({ mobile: false }),
    };
  }
}
</script>
</body>
</html>
